[project]
name = "pdf-safetools"
version = "0.1.0"
description = "Local-first PDF utility and security tool for Windows"
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.12"
strict = true
